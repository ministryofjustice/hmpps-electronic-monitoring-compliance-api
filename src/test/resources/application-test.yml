server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

hmpps-auth:
  url: "http://localhost:8090/auth"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

spring:
  jpa:
    show-sql: true

electronic-monitoring-datastore:
  role-arn: test-role
  region: eu-west-2
  session-name: test-session
  athena:
    database: test_database
    work-group: test-workgroup
    events-table: events
    endpoint-url: http://localhost:8091

aws:
  endpoint-url: http://localhost:8091